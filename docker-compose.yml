  #     QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/rental_management
  #     QUARKUS_DATASOURCE_USERNAME: postgres
  #     QUARKUS_DATASOURCE_PASSWORD: example
  #     QUARKUS_HTTP_PORT: 8080
  #   networks:
  #     - rental_net
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.0"
  #         memory: 512M

volumes:
  postgres_data:
    driver: local

networks:
  rental_net:
    driver: bridge
