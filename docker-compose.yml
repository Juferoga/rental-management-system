services:
  db:
    image: postgres:16-alpine
    container_name: rental_db
    restart: unless-stopped
    shm_size: 64mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bd/init-1-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./bd/init-2-data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./bd/init-2-triggers.sql:/docker-entrypoint-initdb.d/03-triggers.sql:ro
      - ./bd/init-3-procedures.sql:/docker-entrypoint-initdb.d/04-procedures.sql:ro
    networks:
      - rental_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  adminer:
    image: adminer:latest
    container_name: rental_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - rental_net
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rental_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - rental_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rental_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - rental_net
    depends_on:
      - backend

  # openclaw:
  #   image: ghcr.io/openclaw/openclaw:latest
  #   container_name: rental_openclaw
