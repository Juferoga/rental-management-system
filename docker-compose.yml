services:

  db:
    image: postgres:16-alpine
    container_name: rental_db
    restart: unless-stopped
    shm_size: 64mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: rental_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bd/init-1-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./bd/init-2-triggers.sql:/docker-entrypoint-initdb.d/02-triggers.sql:ro
      - ./bd/init-3-procedures.sql:/docker-entrypoint-initdb.d/03-procedures.sql:ro
    networks:
      - rental_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental_management"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  adminer:
    image: adminer:latest
    container_name: rental_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - rental_net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # -------------------------------------------------------------------------
  # FUTURO: Backend Quarkus
  # Descomenta y ajusta cuando tengas el proyecto listo.
  # -------------------------------------------------------------------------
  # backend:
  #   image: quarkus/rental-backend:latest   # o usa 'build: ./backend'
  #   container_name: rental_backend
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8080"
